<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — NOC Assistant</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div style="text-align: center; margin-bottom: 32px;">
      <h1>NOC Assistant</h1>
      <p class="muted">GenAI Network Device Monitoring</p>
    </div>
    <div class="card">
      <form onsubmit="event.preventDefault(); window.location.href='dashboard.html'; return false;">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="engineer@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" required>
        </div>
        <div class="field">
          <button class="btn primary" style="width:100%" type="submit">Sign in</button>
        </div>
        <p class="muted" style="font-size:.85rem;text-align:center">Demo credentials: any email and password</p>
      </form>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
